[tool.poetry]
name = "10-team-matching-quiz-ai"
version = "0.1.0"
description = "AI 기반 면접 질문 생성, 복습 퀴즈 생성, STT 피드백 서버"
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# ── Core AI / NLP ─────────────────────────────
torch = "2.6.0"
transformers = "4.51.3"
accelerate = "^0.30.1"
peft = "^0.10.0"
datasets = "^2.19.0"

# ── FastAPI + Inference Server ────────────────
fastapi = "0.115.9"
flashinfer-python = "0.2.2.post1"
uvicorn = "^0.29.0"
vllm = "0.8.5.post1"

# ── RAG & Vector DB ───────────────────────────
langchain = "0.3.24"
boto3 = "^1.34.0"
bitsandbytes = "0.45.3"
chromadb = "1.0.7"
sentence-transformers = "^2.7.0"
scipy = "^1.13.0"
keybert = "^0.9.0"

# ── STT (Whisper) ─────────────────────────────
whisper = "^1.1.10" # openai-whisper 기반

# ── Monitoring ────────────────────────────────
langfuse = "2.60.3"
langsmith = "0.3.33"

# ── Util / Infra ──────────────────────────────
python-dotenv = "^1.1.0"
pandas = "^2.2.2"
tqdm = "^4.67.1"
requests = "^2.31.0"
loguru = "^0.7.2"
mysql-connector-python = "^8.4.0"

# ── Test / Export ─────────────────────────────
pytest = "^8.2.0"
poetry-plugin-export = "^1.9.0"

# ── 수동 추가 패키지 ───────────────
email_validator = "2.2.0"
jaraco-classes = "3.4.0"
jaraco-context = "6.0.1"
jaraco-functools = "4.1.0"
jpype1 = "1.5.2"
konlpy = "0.6.0"
lxml = "5.4.0"
mistral_common = "1.5.4"
outlines_core = "0.1.26"
prometheus_client = "0.21.1"
pyasn1_modules = "0.4.2"
pydantic_core = "2.33.2"
pyproject_hooks = "1.2.0"
typing_extensions = "4.13.2"

# ── (Optional) ───────────
httpx = "^0.28.1"
tiktoken = "0.9.0"
pydantic =  "^2.11.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"